<script>
/* 全局播放状态提示（搜索页内直听） */
(function () {
  if (window.PlayerEmbed && window.PlayerEmbed.setStatusFn) {
    window.PlayerEmbed.setStatusFn(function (kind, title) {
      var el = document.getElementById('playerStatus');
      if (!el) return;
      if (kind === 'fail') {
        el.style.display = '';
        el.textContent = '⚠️ 试听失败：' + (title || '该曲可能为 VIP 或需登录 QQ音乐') + '。可点击歌曲标题跳转大屏/QQ音乐。';
      } else if (kind === 'load') {
        el.style.display = '';
        el.textContent = '⏳ ' + (title || '正在查找可播版本…');
      } else if (kind === 'play' && title) {
        el.style.display = '';
        el.textContent = '🎵 正在试听：' + title;
      } else if (kind === 'pause') {
        el.style.display = '';
        el.textContent = '⏸ 已暂停';
      }
    });
  }
})();
</script>
