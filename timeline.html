    <p class="footnote">时间轴节点来源分级：官方（机构/官网）、官方报道（新华社/中新社等）、官方通告（巡演主办）、公开资料（百科级）。持续更新。</p>
    <script>
    (function () {
        'use strict';
        function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        var TYPE_CN = { life: '出生·生活', career: '生涯', award: '奖项', album: '专辑', media: '综艺·媒体', tour: '巡演' };
        fetch('data/timeline.json', { cache: 'no-store' })
            .then(function (r) { return r.json(); })
            .then(function (list) {
                var box = document.getElementById('tlList');
                var html = '<ul class="tl">' + list.map(function (t) {
                    var badge = '<span class="badge ' + esc(t.type) + '">' + esc(TYPE_CN[t.type] || t.type) + '</span>';
                    var src = t.source ? '<div class="tl-src">信源：' + esc(t.source) + '</div>' : '';
                    return '<li class="tl-item"><span class="tl-date"><time datetime="' + esc(t.date) + '">' + esc(t.date) + '</time></span>' +
                        '<span class="tl-dot"></span><div class="tl-body">' + badge +
                        '<div class="tl-title">' + esc(t.title) + '</div>' + src + '</div></li>';
                }).join('') + '</ul>';
                box.innerHTML = html;
            })
            .catch(function () { document.getElementById('tlList').innerHTML = '<p style="color:#b03030">数据加载失败，请刷新。</p>'; });
    })();
    </script>
