 body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;max-width:860px;margin:0 auto;padding:20px;color:#333;line-height:1.7}
 h1{color:#1a1a1a;border-bottom:3px solid #c41e3a;padding-bottom:10px}

<h1>📚 王晰知识库 · 语义检索</h1>
<p style="font-size:13px;color:#777;">生涯事实 / 歌曲 / 演出 / 金句 / 问答 全文语义检索（纯前端零后端，向量+语义近邻自动生成）。</p>
<div class="box">
 <input type="text" id="q" placeholder="试试：王晰哪年获得青歌赛冠军？低音炮；六巡广州站唱了什么" onkeydown="if(event.key==='Enter')run()">
 <button onclick="run()">检索</button>
 <div class="hint">💡 示例：<a href="javascript:setQ('王晰哪年获得青歌赛冠军')">青歌赛</a> · <a href="javascript:setQ('王晰加入乐华娱乐的时间')">乐华娱乐</a> · <a href="javascript:setQ('一生守候在哪些演出唱过')">一生守候</a> · <a href="javascript:setQ('王晰的专辑')">专辑</a> · <a href="javascript:setQ('六巡回广州站')">六巡广州</a></div>
</div>
<div id="out"></div>
<div id="stat">加载中…</div>
<script src="kb_semantic.js"></script>
<script>
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function setQ(s){document.getElementById('q').value=s;run();}
function run(){
  var q=document.getElementById('q').value.trim();
  var out=document.getElementById('out');
  if(!q){out.innerHTML='';return;}
  var t0=performance.now();
  var hits=KBSearch.search(q,10);
  var ms=Math.round(performance.now()-t0);
  if(!hits.length){out.innerHTML='<p style="color:#888">未命中，换个说法试试（支持别名：低音炮/Low C/晰哥）。</p>';return;}
  var html=hits.map(function(h){
    var cls=h.type||'entity';
    var score=h.score!=null?' <span style="color:#999">相关度 '+h.score+'</span>':'';
    var nei='';
    if(h.neighbor_of){
      var src=hits.find(function(x){return x.id===h.neighbor_of;});
      nei='<div class="nei">🧲 与「<b>'+esc(src?src.text.slice(0,24):h.neighbor_of)+'</b>」语义相近</div>';
    }
    return '<div class="hit"><div class="text"><span class="tag '+cls+'">'+cls+'</span>'+esc(h.text)+score+'</div>'+
      '<div class="meta">'+esc(h.id)+'</div>'+nei+'</div>';
  }).join('');
  out.innerHTML='<p style="font-size:12px;color:#999">命中 '+hits.length+' 条 · 用时 '+ms+'ms</p>'+html;
}
KBSearch.init().then(function(m){
  var t=m.types||{};
  var parts=Object.keys(t).map(function(k){return k+' '+t[k];}).join(' / ');
  document.getElementById('stat').textContent='索引就绪：'+m.doc_count+' 条 · 模型 '+m.model+'（'+m.dim+'维,int8） · '+parts;
}).catch(function(e){document.getElementById('stat').textContent='索引加载失败：'+e;});
</script>
</body>
