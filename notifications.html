<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自动通知聚合｜王晰 GEO 资料站</title>
<meta name="description" content="王晰 GEO 资料站自动通知聚合页：QQ/网易云新歌、全网动态、自动部署等本地通知，按来源/时间聚合展示。">
<link rel="canonical" href="https://wx409.github.io/notifications.html">
<link rel="stylesheet" href="assets/brand.css">
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;max-width:1200px;margin:0 auto;padding:20px;background:#fafafa;color:#333;line-height:1.7}
h1{color:#1a1a1a;border-bottom:3px solid #c41e3a;padding-bottom:10px}
.sub{color:#666}
.nav{background:#fff;border:1px solid #eee;border-radius:10px;padding:12px 16px;margin-bottom:20px;display:flex;flex-wrap:wrap;gap:6px 20px}
.nav a{color:#c41e3a;text-decoration:none;font-weight:500}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
.card{background:#fff;border:1px solid #eee;border-radius:12px;padding:14px 16px;box-shadow:0 1px 6px rgba(0,0,0,.04)}
.card .num{font-size:28px;font-weight:700;color:#c41e3a}
.card .lbl{font-size:13px;color:#888}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{background:#fff;border:1px solid #ddd;border-radius:20px;padding:5px 14px;font-size:13px;cursor:pointer;color:#555}
.chip.on{background:#c41e3a;border-color:#c41e3a;color:#fff}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #eee;border-radius:12px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.05)}
th,td{border-bottom:1px solid #eee;padding:10px 12px;text-align:left;vertical-align:top;font-size:14px}
th{background:#f7f7f7;white-space:nowrap;position:sticky;top:0}
.time{white-space:nowrap;color:#666;font-variant-numeric:tabular-nums}
.cat{white-space:nowrap}
.badge{display:inline-block;font-size:12px;padding:2px 10px;border-radius:20px;background:#f0f0f0;color:#555}
.badge.QQ新歌{background:#e0f0ff;color:#0a5a8a}
.badge.网易云新歌{background:#ffe3e3;color:#a02c2c}
.badge.全网动态{background:#f3e8ff;color:#7c3aed}
.badge.汇总{background:#e6f7ee;color:#0a7a5a}
.badge.通知{background:#eee;color:#666}
.title{font-weight:600;color:#1a1a1a;min-width:180px}
.content{white-space:pre-wrap;color:#444;font-size:13px}
.source{color:#999;font-size:12px}
.empty{color:#888;padding:40px;text-align:center}
.meta{color:#888;font-size:13px;margin-bottom:10px}
a{color:#c41e3a;word-break:break-all}
@media(max-width:800px){th,td{display:block;width:100%;box-sizing:border-box}tr{border-bottom:1px solid #eee}}
</style>
</head>
<body>
<div class="nav">
    <a href="index.html">🏠 首页</a>
    <a href="data-timeline.html">📈 数据时间线</a>
    <a href="dashboard/">📊 数据大屏</a>
    <a href="notifications.html" style="background:#c41e3a;color:#fff;padding:2px 12px;border-radius:16px;">📋 自动通知聚合</a>
    <a href="search.html">🔍 搜索</a>
</div>
<h1>📋 自动通知聚合</h1>
<p class="sub">QQ/网易云新歌、Bing 全网动态、自动部署记录等不再受微信推送条数限制，按来源/时间聚合展示。</p>
<p class="meta" id="meta">加载中…</p>
<div class="cards" id="cards"></div>
<div class="chips" id="chips"></div>
<div id="tableWrap"><p class="empty">加载中…</p></div>

<script>
(function(){
  var currentFilter='全部', items=[];
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function fmtTime(t){
    if(!t)return '—';
    var d=new Date(String(t).replace(' ','T')+':00');
    if(isNaN(d))return esc(t);
    var diff=(Date.now()-d.getTime())/1000;
    if(diff<60)return '刚刚';
    if(diff<3600)return Math.floor(diff/60)+' 分钟前';
    if(diff<86400)return Math.floor(diff/3600)+' 小时前';
    if(diff<86400*7)return Math.floor(diff/86400)+' 天前';
    return esc(t);
  }
  function render(){
    var shown = currentFilter==='全部' ? items : items.filter(function(x){return (x.category||'通知')===currentFilter;});
    // cards
    var today = new Date().toISOString().slice(0,10);
    var todayN = items.filter(function(x){return (x.time||'').slice(0,10)===today;}).length;
    var cats={};
    items.forEach(function(x){var c=x.category||'通知';cats[c]=(cats[c]||0)+1;});
    var catHtml=Object.keys(cats).map(function(c){return '<div class="card"><div class="num">'+cats[c]+'</div><div class="lbl">'+esc(c)+'</div></div>';}).join('');
    document.getElementById('cards').innerHTML =
      '<div class="card"><div class="num">'+items.length+'</div><div class="lbl">累计记录</div></div>'+
      '<div class="card"><div class="num">'+todayN+'</div><div class="lbl">今日新增</div></div>'+catHtml;
    // chips
    var allCats=['全部'].concat(Object.keys(cats));
    document.getElementById('chips').innerHTML = allCats.map(function(c){
      return '<span class="chip'+(currentFilter===c?' on':'')+'" data-c="'+esc(c)+'">'+esc(c)+' ('+(c==='全部'?items.length:(cats[c]||0))+')</span>';
    }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('#chips .chip'),function(el){
      el.onclick=function(){currentFilter=el.getAttribute('data-c');render();};
    });
    // table
    if(!shown.length){
      document.getElementById('tableWrap').innerHTML='<p class="empty">暂无通知记录</p>';return;
    }
    var rows=shown.slice().reverse().map(function(it){
      var cat=it.category||'通知';
      var url=it.url?'<br><a href="'+esc(it.url)+'" target="_blank" rel="noopener nofollow">'+esc(it.url)+'</a>':'';
      var src=it.source?'<div class="source">来源：'+esc(it.source)+'</div>':'';
      return '<tr>'+
        '<td class="time">'+esc(it.time)+'<div class="source">'+fmtTime(it.time)+'</div></td>'+
        '<td class="cat"><span class="badge '+esc(cat)+'">'+esc(cat)+'</span></td>'+
        '<td class="title">'+esc(it.title)+'</td>'+
        '<td class="content">'+esc(it.content)+url+src+'</td>'+
        '</tr>';
    }).join('');
    document.getElementById('tableWrap').innerHTML='<table><thead><tr><th>时间</th><th>类型</th><th>标题</th><th>内容</th></tr></thead><tbody>'+rows+'</tbody></table>';
  }
  function load(){
    fetch('data/notifications.json',{cache:'no-store'})
      .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
      .then(function(data){
        items=(data&&data.items)||[];
        document.getElementById('meta').textContent='共 '+items.length+' 条 · 最近更新：'+(data.updated_at||'—')+' · 每 60 秒自动刷新';
        render();
      })
      .catch(function(e){
        document.getElementById('meta').textContent='加载失败';
        document.getElementById('tableWrap').innerHTML='<p class="empty">数据加载失败：'+esc(e.message)+'</p>';
      });
  }
  load();
  setInterval(load,60000);
})();
</script>
</body>
</html>
