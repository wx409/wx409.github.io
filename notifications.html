<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自动通知本地表格｜王晰 GEO 资料站</title>
<meta name="description" content="王晰 GEO 资料站自动更新通知本地表格：新歌、巡演候选、部署状态等记录，全部留存本地并实时展示。">
<link rel="canonical" href="https://wx409.github.io/notifications.html">
<link rel="stylesheet" href="assets/brand.css">
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;max-width:1100px;margin:0 auto;padding:20px;background:#fafafa;color:#333;line-height:1.7}
h1{color:#1a1a1a;border-bottom:3px solid #c41e3a;padding-bottom:10px}
.sub{color:#666}
.nav{background:#fff;border:1px solid #eee;border-radius:10px;padding:12px 16px;margin-bottom:20px;display:flex;flex-wrap:wrap;gap:6px 20px}
.nav a{color:#c41e3a;text-decoration:none;font-weight:500}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #eee;border-radius:10px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.05);margin:16px 0}
th,td{border:1px solid #eee;padding:10px 12px;text-align:left;vertical-align:top;font-size:14px}
th{background:#f7f7f7;white-space:nowrap}
.time{white-space:nowrap;color:#666}
.title{font-weight:600;color:#1a1a1a;min-width:160px}
.content{white-space:pre-wrap;color:#444}
.empty{color:#888;padding:40px;text-align:center}
.meta{color:#888;font-size:13px;margin-bottom:10px}
@media(max-width:700px){th,td{display:block;width:100%;box-sizing:border-box}}
</style>
</head>
<body>
<div class="nav">
    <a href="index.html">🏠 首页</a>
    <a href="data-timeline.html">📈 数据时间线</a>
    <a href="dashboard/">📊 数据大屏</a>
    <a href="notifications.html" style="background:#c41e3a;color:#fff;padding:2px 12px;border-radius:16px;">📋 自动通知</a>
    <a href="search.html">🔍 搜索</a>
</div>
<h1>📋 自动通知本地表格</h1>
<p class="sub">自动更新产生的新歌/候选/部署记录会写入 <code>data/notifications.json</code>，本页实时读取展示，不再依赖 Server酱推送。</p>
<p class="meta" id="meta">加载中…</p>
<div id="tableWrap"><p class="empty">加载中…</p></div>

<script>
(function(){
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  fetch('data/notifications.json',{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(data){
      var items=(data&&data.items)||[];
      document.getElementById('meta').textContent='共 '+items.length+' 条 · 最近更新：'+(data.updated_at||'—');
      if(!items.length){
        document.getElementById('tableWrap').innerHTML='<p class="empty">暂无通知记录</p>';
        return;
      }
      var rows=items.slice().reverse().map(function(it){
        return '<tr><td class="time">'+esc(it.time)+'</td><td class="title">'+esc(it.title)+'</td><td class="content">'+esc(it.content)+'</td></tr>';
      }).join('');
      document.getElementById('tableWrap').innerHTML='<table><thead><tr><th>时间</th><th>标题</th><th>内容</th></tr></thead><tbody>'+rows+'</tbody></table>';
    })
    .catch(function(e){
      document.getElementById('meta').textContent='加载失败';
      document.getElementById('tableWrap').innerHTML='<p class="empty">数据加载失败：'+esc(e.message)+'</p>';
    });
})();
</script>
</body>
</html>
