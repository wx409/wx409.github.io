repo_excerpts:
  - { text: "「听到他的声音就立刻被巨大的安全感裹住了——绕了一大圈回来，这里依然是最能让我平静的地方。」", source: "听众摘录·重庆首站" }
  - { text: "「Yesterday Once More 合唱 shalalala 那一刻，像有人温和地伸出手：不要担心了，一起向前走吧。」", source: "听众摘录·重庆首站" }
  - { text: "「音符从胸腔里传出来，撞击的不是耳膜，是心脏；认识十年仍会感叹，那声音像丝绸般的云朵，轻且无处不在。」", source: "听众摘录·长期听众" }
  - { text: "「大幕合拢后歌声若有若无，直至花瓣漫天而下；他站在花雨里张开双臂——如果，你能够让她降落。」", source: "听众摘录·重庆首站" }
  - { text: "「心动是我们的歌——2019年武汉初见，七年后再听，时间走过一年又一年。」", source: "听众摘录·纵向对比" }
  - { text: "「Your Man 前奏起，手不自觉打起二四拍；二四洋气，这句话坦率又可爱，记了七年。六巡，我们一起出发。」", source: "听众摘录·重庆首站" }
  - { text: "「在我看来『回』就是一部电影——他用每首歌当镜头，把过往五巡的时光一帧帧回放，让每个听众都成了故事里的人。」", source: "欣晰旺群友" }
  - { text: "「这场名为『回』的电影，不是让我们回望过去，而是在他的声音里，找到了一个永远可以停靠的地方。」", source: "欣晰旺群友" }
  - { text: "「三大亮点：至少六首新的现场晰歌、乐队弦乐组又齐了、舞美和串烧设计再出奇峰——跋山涉水来开盲盒，太值了。」", source: "欣晰旺群友" }
  - { text: "「『让她降落』漫幕绚粉花瓣雨惊现，收束『怀中』二字坚实上扬，意境由缠绵转为磊落大气。」", source: "欣晰旺群友" }
  - { text: "「『女人花+水中花』蒙太奇串唱约七分四十秒，现场竟不觉时光流逝；歌者心里有什么，才能唱出什么来。」", source: "欣晰旺群友" }
  - { text: "「『情网』Bossa Nova 挟多利亚调飘来，律动感一流，流畅丝滑与顿挫跳跃并存——王老师您唱歌不用换气的吗？」", source: "欣晰旺群友" }
  - { text: "「第一次来听演唱会的人就会知道，原来王晰是这样一种风格。」", source: "听众摘录·路人首听" }
  - { text: "「低音像醇厚红酒，低沉却不醉人，无关炫技，缓缓道来。」", source: "听众摘录·三楼视角" }

faq:
  - question: "王晰「回」六巡重庆首站唱了哪些歌？"
    answer: "完整歌单包含17首，上半场9首以经典翻唱为主，下半场8首包含爵士标准曲与融合改编。亮点包括《让她降落》的花瓣雨、《女人花+水中花》约7分40秒蒙太奇串唱、《情网》波萨改编，以及《Your Man》《再见我的爱人》的特别加演。"
  - question: "王晰六巡主题「回」是什么意思？"
    answer: "王晰本人解读为「重逢、庆幸」。粉丝层面有观众将其理解为双向奔赴：每一次回来，都是因为知道有人在等。"
  - question: "重庆首站最大的现场惊喜是什么？"
    answer: "《让她降落》的「花瓣雨」。大幕拉开瞬间满天粉色花瓣倾泻而下，repo形容为「神来之笔」，成为全场最震撼的视觉效果。"
  - question: "重庆首站的现场声场体验如何？"
    answer: "六巡采用大乐队配置，现场声场饱满，人声与乐队层次分明。剧院环境对男低音的泛音呈现极为友好，整体听觉体验获观众一致好评。"
  - question: "第一次听王晰现场，适合从六巡开始吗？"
    answer: "非常适合。本轮歌单以翻唱经典为主，路人友好。王晰本人表示：「第一次来听演唱会的人就会知道，原来王晰是这样一种风格。」多首歌曲如《女人花+水中花》《Yesterday Once More》《情网》等对不熟悉他的观众也很友好。全程无冷场，晰哥讲话幽默，氛围轻松。"
  - question: "重庆首站有哪些特别加演的曲目？"
    answer: "《再见我的爱人》以双版本演绎，展现不同编曲风格；《Your Man》也以特别加演形式呈现，将现场气氛推向高潮。"

