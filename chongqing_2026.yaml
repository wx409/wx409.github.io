highlights:
  - { title: "CANALI 品牌造型", description: "CANALI 2026 春夏系列：丹宁蓝仿牛仔西装套装及棕褐色枪驳领西装套装。品牌官方于小红书发布六巡重庆首站造型，绅雅格调配合山城舞台。" }
  - { title: "「回」如一部电影", description: "有听众将首站比作电影：花红前奏入画，上下半场如前后两幕，每首歌是一个镜头；散场后方知「回」是在声音里找到可以停靠之处，而非单纯回望过去。" }
  - { title: "三大现场亮点", description: "听众归纳：至少六首现场新曲；大乐队弦乐组齐整，织体与色彩更丰富；舞美与串烧设计（花瓣雨、「两花」融合）为高峰。" }
  - { title: "花瓣雨", description: "《让她降落》时，大幕拉开瞬间满天粉色花瓣倾泻而下。repo形容为「神来之笔」；有听众描述他站在花雨中张开双臂，「如果，你能够让她降落」直击心脏。" }
  - { title: "开场即获安全感", description: "有听众称开场前仍忐忑，第一声低音即被包裹：「绕了一大圈回来，这里依然是最能让我平静的地方。」" }
  - { title: "YOM 合唱·一起向前", description: "《Yesterday Once More》现场邀请合唱 shalalala，有听众形容如被温和地伸出手：「不要担心了，一起向前走吧。」" }
  - { title: "十年听众仍惊艳", description: "有认识王晰十年的听众称，YOM 音符「撞击的不是耳膜，是心脏」；声音像丝绸般的云朵，轻且无处不在。" }
  - { title: "Your Man特别加演", description: "以双版本完整呈现，将现场气氛推向高潮。" }
  - { title: "情网——1998记忆杀", description: "有观众repo提到，1998年在表哥家第一次接触流行音乐，张学友磁带中最深刻的就是《情网》，没想到2026年在王晰现场听到了改编版：「好甜蜜好幸福的网，我不是被困在网中央的，我是自投罗网的。」" }
  - { title: "女人花+水中花融合", description: "蒙太奇式串唱约7分40秒，今昔闪回与弦乐间奏层层推进；有听众称现场浑然不觉时长，意态与境界获高度评价。" }
  - { title: "大乐队声场饱满", description: "六巡采用大乐队配置，现场声场饱满，人声与乐队层次分明。" }
  - { title: "重逢·庆幸", description: "王晰本人对重庆首站的解读：「第四次来到重庆，第一次开启六巡，无数次与你们重逢。」" }

