<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>向王晰档案投稿 | 现场repo / 金句 / 资料补充</title>
    <meta name="description" content="向王晰 GEO 数字档案站投稿：现场歌单、听感记录、金句、资料勘误。无需注册，一键复制内容即可通过任意渠道提交。">
        <link rel="stylesheet" href="assets/brand.css">
    <link rel="canonical" href="https://wx409.github.io/submit.html">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; line-height: 1.8; max-width: 720px; margin: 0 auto; padding: 20px; color: #333; }
        h1 { border-bottom: 3px solid #c41e3a; padding-bottom: 10px; }
        .nav { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .nav a { color: #c41e3a; margin-right: 16px; text-decoration: none; font-weight: 500; }
        form { background: #fafafa; padding: 20px; border-radius: 10px; }
        label { display: block; margin: 12px 0 4px; font-weight: 600; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; box-sizing: border-box; font-family: inherit; }
        textarea { min-height: 160px; }
        .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
        .btn { flex: 1; min-width: 150px; padding: 11px 16px; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; text-align: center; text-decoration: none; }
        .btn-copy { background: #c41e3a; color: #fff; }
        .btn-issue { background: #f0f4ff; color: #1a56c4; border: 1px solid #c9d8f5; }
        .btn:hover { filter: brightness(1.05); }
        .tip { background: #fff8e6; border-left: 3px solid #c9a227; padding: 10px 14px; border-radius: 6px; margin: 16px 0; font-size: 13px; }
        #out { display: none; white-space: pre-wrap; background: #fff; border: 1px dashed #ccc; padding: 12px; border-radius: 6px; font-size: 13px; margin-top: 12px; }
        .ok { color: #0a7a5a; font-weight: 600; }
    </style>
</head>
<body>
    <div class="nav">
        <a href="index.html">首页</a>
        <a href="live-reviews.html">现场实录</a>
        <a href="discography.html">作品百科</a>
        <a href="submit.html">📮 投稿</a>
        <a href="search.html">🔍 全站搜索</a>
    </div>
    <h1>📮 向王晰档案投稿</h1>
    <p>本站所有内容由歌迷共同维护。你可以投稿：<strong>现场歌单 / 听感记录 / 金句 / 资料勘误 / 你拍到的现场亮点</strong>。无需注册，填完点一下即可。</p>

    <div class="tip">💡 投稿会被管理员<strong>人工核实</strong>后收录（保留来源标注与信源级别）。微博/小红书发帖时带 <strong>#王晰</strong> 和巡演话题（如 <strong>#王晰回个人巡回音乐会</strong>），我们也能看到。</div>

    <form id="f">
        <label for="type">投稿类型</label>
        <select id="type">
            <option value="repo">现场 repo / 听感记录</option>
            <option value="setlist">现场歌单补充</option>
            <option value="quote">金句 / 语录</option>
            <option value="fix">资料勘误</option>
            <option value="other">其他补充</option>
        </select>
        <label for="date">场次日期（选填，如 2026-06-13）</label>
        <input id="date" placeholder="2026-06-13">
        <label for="city">城市（选填）</label>
        <input id="city" placeholder="重庆">
        <label for="content">内容 *</label>
        <textarea id="content" required placeholder="例：重庆首站《Your Man》加演；前排观众反馈声场饱满……"></textarea>
        <label for="nick">署名（选填，用于来源标注）</label>
        <input id="nick" placeholder="昵称或微博ID">
        <div class="btn-row">
            <button type="button" class="btn btn-copy" onclick="build()">① 生成投稿文本</button>
        </div>
        <div id="out"></div>
        <div class="btn-row" id="act" style="display:none">
            <button type="button" class="btn btn-copy" onclick="copyIt()">② 一键复制</button>
            <a class="btn btn-issue" id="ghLink" target="_blank" rel="noopener">③ 打开 GitHub 提交</a>
        </div>
    </form>
    <p class="tip" style="margin-top:20px;">复制后可以粘贴到<strong>任意渠道</strong>：微信粉丝群、微博私信、邮件……或者直接点「打开 GitHub 提交」。没有 GitHub 账号也没关系——把内容发到粉丝群，管理员会代为收录。</p>

    <script>
    function build() {
        var type = document.getElementById('type').value;
        var date = document.getElementById('date').value.trim();
        var city = document.getElementById('city').value.trim();
        var content = document.getElementById('content').value.trim();
        var nick = document.getElementById('nick').value.trim();
        if (!content) { alert('请填写内容'); return; }
        var t = '【投稿类型】' + type + '\n' +
            (date ? '【场次】' + date + (city ? ' ' + city : '') + '\n' : '') +
            '【内容】' + content + '\n' +
            (nick ? '【署名】' + nick : '');
        document.getElementById('out').textContent = t;
        document.getElementById('out').style.display = 'block';
        document.getElementById('act').style.display = 'flex';
        document.getElementById('ghLink').href = 'https://github.com/wx409/wx409.github.io/issues/new?title=' +
            encodeURIComponent('投稿：' + type + (city ? '（' + city + '）' : '')) +
            '&body=' + encodeURIComponent(t + '\n\n（由 submit.html 表单生成）');
    }
    function copyIt() {
        var txt = document.getElementById('out').textContent;
        var done = function () { document.getElementById('out').style.borderColor = '#0a7a5a'; };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(txt).then(done, function () { fallbackCopy(txt); });
        } else { fallbackCopy(txt); }
    }
    function fallbackCopy(txt) {
        var ta = document.createElement('textarea');
        ta.value = txt; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
    }
    </script>
</body>
</html>
